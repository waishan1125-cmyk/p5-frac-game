<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>五邑工商總會學校 FDBWA · 異分母分數加減</title>
<style>
:root{
  --c-F:#FF6B6B; --c-D:#F5A623; --c-B:#4ECDC4; --c-W:#5AA9FF; --c-A:#8AC926;
  --cream:#FFF8ED; --ink:#4A3B32; --ink-soft:#8A7668; --edge:#E8D9C4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Comic Sans MS","Chalkboard SE","Microsoft JhengHei","PingFang TC",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 12%, rgba(255,201,74,.30), transparent 40%),
    radial-gradient(circle at 90% 8%, rgba(78,205,196,.26), transparent 38%),
    radial-gradient(circle at 85% 90%, rgba(90,169,255,.24), transparent 42%),
    radial-gradient(circle at 8% 92%, rgba(255,107,107,.20), transparent 40%),
    var(--cream);
  min-height:100vh;user-select:none;
}
#app{max-width:760px;margin:0 auto;padding:14px 14px 30px;display:flex;flex-direction:column;min-height:100vh}
.banner{background:#fff;border:3px solid var(--edge);border-radius:24px;box-shadow:0 6px 0 var(--edge);padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.letter-strip{display:flex;gap:6px}
.b-tile{width:clamp(34px,7vw,46px);height:clamp(34px,7vw,46px);border-radius:12px;color:#fff;font-weight:bold;font-size:clamp(22px,4.5vw,30px);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.b-tile:nth-child(odd){transform:rotate(-4deg)}
.b-tile:nth-child(even){transform:rotate(4deg)}
.school-name{flex:1 1 auto;min-width:160px;line-height:1.25}
.school-name .zh{display:block;font-weight:bold;font-size:clamp(15px,3.2vw,19px)}
.school-name .en{display:block;color:var(--ink-soft);font-size:clamp(12px,2.6vw,15px)}
.stars-badge{margin-left:auto;font-weight:bold;font-size:clamp(17px,3.6vw,22px);background:var(--cream);border:2px solid var(--edge);border-radius:999px;padding:5px 14px}
h1{text-align:center;font-size:clamp(22px,5.4vw,34px);margin:16px 0 4px;color:var(--c-F);text-shadow:2px 2px 0 rgba(0,0,0,.06)}
.prompt,.qnum{text-align:center;color:var(--ink-soft);font-size:clamp(14px,3vw,17px);margin:0 0 6px}
.qnum{font-weight:bold}
.chip{display:inline-block;background:#fff;border:2px solid var(--edge);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--ink-soft);margin:0 auto 8px}
.progress{display:flex;gap:7px;justify-content:center;margin:2px 0 12px}
.pip{width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--edge)}
.pip.done{background:#FFC94A;border-color:#D9A32A}
.pip.now{background:var(--c-B);border-color:#2FA39A;transform:scale(1.25)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center}
.qcard{background:#fff;border:3px solid var(--edge);border-radius:26px;box-shadow:0 6px 0 var(--edge);padding:22px 18px;width:100%;text-align:center}
.tag{display:inline-block;background:#FFF3D6;border-radius:999px;padding:3px 12px;font-size:13px;margin-bottom:10px;color:#8A5A12}
.expr{font-size:clamp(28px,6.5vw,42px);font-weight:bold;margin:8px 0 4px;line-height:1.35}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .12em}
.frac .n{border-bottom:2.5px solid var(--ink);padding:0 .18em .04em;min-width:1.1em}
.frac .d{padding:.04em .18em 0}
.mix{display:inline-flex;align-items:center;gap:.12em}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-top:16px}
.choice{border:3px solid var(--edge);border-radius:20px;background:#fff;cursor:pointer;font-family:inherit;color:var(--ink);font-size:clamp(20px,4.6vw,28px);font-weight:bold;padding:14px 8px;box-shadow:0 5px 0 var(--edge);min-height:74px}
.choice:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.choice.ok{background:#C8F5C4;border-color:#5BB85A;box-shadow:0 5px 0 #5BB85A}
.choice.bad{background:#FFD0D0;border-color:#E85D5D;box-shadow:0 5px 0 #E85D5D}
.fb{min-height:28px;margin-top:12px;font-weight:bold;font-size:clamp(16px,3.4vw,20px)}
.hidden{display:none!important}
#done{background:#fff;border:3px solid var(--edge);border-radius:26px;box-shadow:0 6px 0 var(--edge);padding:22px 16px;text-align:center;width:100%}
.face{font-size:64px;margin:4px 0}
#doneStars{font-size:clamp(22px,5vw,30px);font-weight:bold;margin:6px 0}
#againBtn{margin-top:14px;border:3px solid var(--edge);border-radius:999px;background:#FFC94A;cursor:pointer;font-family:inherit;font-size:18px;font-weight:bold;padding:10px 22px;box-shadow:0 5px 0 #D9A32A}
.review{text-align:left;margin:14px 0 0;background:var(--cream);border-radius:16px;padding:12px 14px;font-size:15px}
.review h3{margin:0 0 8px;font-size:16px}
.review li{margin:6px 0}
.foot{text-align:center;color:var(--ink-soft);font-size:12px;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transform:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="banner">
    <div class="letter-strip">
      <div class="b-tile" style="background:var(--c-F)">F</div>
      <div class="b-tile" style="background:var(--c-D)">D</div>
      <div class="b-tile" style="background:var(--c-B)">B</div>
      <div class="b-tile" style="background:var(--c-W)">W</div>
      <div class="b-tile" style="background:var(--c-A)">A</div>
    </div>
    <div class="school-name">
      <span class="zh">五邑工商總會學校</span>
      <span class="en">FDBWA · 五年級 小學數學</span>
    </div>
    <div class="stars-badge" id="starBadge">⭐ 0</div>
  </div>
  <h1>🍰 分數加減小達人</h1>
  <p class="prompt">五上A 單元二　分數(三)　異分母加減及混合運算</p>
  <div id="gameArea">
    <div class="qnum" id="qnum"></div>
    <div class="progress" id="progressEl"></div>
    <div class="stage">
      <div class="qcard">
        <div class="tag" id="tag"></div>
        <div class="expr" id="expr"></div>
        <div class="choices" id="choicesEl"></div>
        <div class="fb" id="fb"></div>
      </div>
    </div>
  </div>
  <div id="done" class="hidden">
    <div class="face" id="doneFace"></div>
    <div id="doneStars"></div>
    <div id="doneSub"></div>
    <div class="review" id="review"></div>
    <button type="button" id="againBtn">再玩一次 🔁</button>
    <div class="foot">🏫 五邑工商總會學校 FDBWA · 小學數學</div>
  </div>
</div>
<script>
const ROUND = 10;
const F = (n,d) => `<span class="frac"><span class="n">${n}</span><span class="d">${d}</span></span>`;
const M = (w,n,d) => `<span class="mix"><span>${w}</span>${F(n,d)}</span>`;
const BANK = [
  {tag:"加法 · 真分數", html:`${F(1,3)} + ${F(1,4)} = ?`, ans:F(7,12), opts:[F(7,12),F(2,7),F(2,12),F(1,7)]},
  {tag:"加法 · 倍數分母", html:`${F(2,5)} + ${F(1,10)} = ?`, ans:F(1,2), opts:[F(1,2),F(3,10),F(3,15),F(2,15)]},
  {tag:"三個異分母相加", html:`${F(1,4)} + ${F(1,3)} + ${F(1,6)} = ?`, ans:F(3,4), opts:[F(3,4),F(3,13),F(1,2),F(5,12)]},
  {tag:"加法 · 帶分數", html:`${M(2,1,3)} + ${M(1,1,2)} = ?`, ans:M(3,5,6), opts:[M(3,5,6),M(3,2,5),M(3,1,5),M(4,5,6)]},
  {tag:"減法 · 真分數", html:`${F(5,6)} − ${F(1,2)} = ?`, ans:F(1,3), opts:[F(1,3),F(4,4),F(4,6),F(1,4)]},
  {tag:"減法 · 真分數", html:`${F(7,8)} − ${F(1,4)} = ?`, ans:F(5,8), opts:[F(5,8),F(6,4),F(3,8),F(3,4)]},
  {tag:"三個異分母相加", html:`${F(1,2)} + ${F(1,5)} + ${F(1,10)} = ?`, ans:F(4,5), opts:[F(4,5),F(3,17),F(3,10),F(7,10)]},
  {tag:"減法 · 帶分數借位", html:`${M(4,1,4)} − ${M(2,1,2)} = ?`, ans:M(1,3,4), opts:[M(1,3,4),M(2,1,4),M(1,1,4),M(2,3,4)]},
  {tag:"加減混合", html:`${F(1,2)} + ${F(1,3)} − ${F(1,6)} = ?`, ans:F(2,3), opts:[F(2,3),F(1,2),"1",F(5,6)]},
  {tag:"加減混合 · 帶分數", html:`${M(3,1,4)} + ${F(1,2)} − ${M(1,3,4)} = ?`, ans:"2", opts:["2",M(2,1,2),"1",M(4,1,2)]}
];
const STAR_KEY = "fdbwa_p5_frac_stars";
let qi = 0, earned = 0, firstTry = true, locked = false, misses = [];
let q = null;
const $ = id => document.getElementById(id);
const gameArea = $("gameArea"), doneArea = $("done");
const choicesEl = $("choicesEl"), progressEl = $("progressEl");
const tot = () => +(localStorage.getItem(STAR_KEY) || 0);
function paintStars(){ $("starBadge").textContent = "⭐ " + tot(); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pips(){
  progressEl.innerHTML = "";
  for(let i=0;i<ROUND;i++){
    const p = document.createElement("div");
    p.className = "pip" + (i<qi ? " done" : i===qi ? " now" : "");
    progressEl.appendChild(p);
  }
}
function showQ(){
  locked = false; firstTry = true;
  q = BANK[qi];
  $("qnum").textContent = `第 ${qi+1} 題／共 ${ROUND} 題`;
  $("tag").textContent = q.tag;
  $("expr").innerHTML = q.html;
  $("fb").textContent = "";
  pips();
  const opts = shuffle(q.opts.slice());
  choicesEl.innerHTML = "";
  opts.forEach(o => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "choice"; b.innerHTML = o; b.dataset.v = o;
    choicesEl.appendChild(b);
  });
}
function confetti(){
  for(let i=0;i<10;i++){
    const s = document.createElement("div");
    s.textContent = ["⭐","🎉","🍬","🌈"][i%4];
    s.style.cssText = `position:fixed;left:${20+Math.random()*60}%;top:30%;font-size:22px;pointer-events:none;z-index:9`;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 700);
  }
}
choicesEl.addEventListener("click", e => {
  const btn = e.target.closest(".choice");
  if(!btn || locked) return;
  if(btn.dataset.v === q.ans){
    locked = true;
    btn.classList.add("ok");
    $("fb").textContent = firstTry ? "答對了！做得好 🎉" : "答對了！記住通分步驟 💪";
    if(firstTry){ earned++; confetti(); }
    else misses.push({html:q.html, pick:misses._last, ans:q.ans});
    setTimeout(next, 850);
  } else {
    firstTry = false;
    misses._last = btn.dataset.v;
    btn.classList.add("bad");
    $("fb").textContent = "再試一次，先找公分母 🔎";
  }
});
function next(){
  qi++;
  if(qi >= ROUND) finish(); else showQ();
}
function finish(){
  gameArea.classList.add("hidden");
  doneArea.classList.remove("hidden");
  localStorage.setItem(STAR_KEY, String(tot() + earned));
  paintStars();
  const face = earned >= 9 ? "🏆" : earned >= 6 ? "🌟" : "🎈";
  $("doneFace").textContent = face;
  $("doneStars").textContent = `今次 ${earned} / ${ROUND} 顆星`;
  $("doneSub").textContent = earned >= 9 ? "太棒了！通分很穩妥。" : earned >= 6 ? "不錯！再練一次會更熟。" : "沒有關係，再玩一次，慢慢來。";
  const rv = $("review");
  if(!misses.length) rv.innerHTML = "<h3>全部答對，沒有需要重溫的題目。</h3>";
  else {
    rv.innerHTML = "<h3>需要重溫的題目</h3><ol>" +
      misses.map(m => `<li>${m.html}<br>你的答案：${m.pick}　正確：${m.ans}</li>`).join("") +
      "</ol>";
  }
}
$("againBtn").addEventListener("click", () => {
  qi = 0; earned = 0; misses = [];
  doneArea.classList.add("hidden");
  gameArea.classList.remove("hidden");
  showQ();
});
paintStars();
showQ();
</script>
</body>
</html>
